<!DOCTYPE html>
<html>
<head>
<title>MSSL User Master</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:#f4f6f9;
}

.header{
background:linear-gradient(90deg,#003366,#0078d7);
color:white;
padding:18px;
text-align:center;
}

.container{
width:95%;
margin:auto;
margin-top:15px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.section-title{
font-size:20px;
margin-bottom:15px;
color:#003366;
border-left:5px solid #0078d7;
padding-left:10px;
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:15px;
}

.field label{
display:block;
font-weight:bold;
margin-bottom:5px;
color:#003366;
}

input,
select{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
font-size:14px;
}

.button-area{
text-align:center;
margin-top:20px;
}

button{
background:#0078d7;
color:white;
border:none;
padding:12px 25px;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#005ea6;
}

.info-card{
background:#eef6ff;
padding:10px;
border-left:5px solid #0078d7;
border-radius:5px;
margin-bottom:15px;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th{
background:#003366;
color:white;
}

th,td{
padding:10px;
border:1px solid #ddd;
text-align:center;
}

.active{
background:#28a745;
color:white;
padding:4px 8px;
border-radius:4px;
}

.inactive{
background:#dc3545;
color:white;
padding:4px 8px;
border-radius:4px;
}

</style>

</head>

<body>

<div class="header">
<h1>MSSL User Login Master</h1>
</div>

<div class="container">

<div class="info-card">
Create and manage system users for LPC, ASSY, Maintenance and Admin.
</div>

<h2 class="section-title">
User Information
</h2>

<form>

<div class="row">

<div class="field">
<label>Employee ID</label>
<input type="text" placeholder="EMP001">
</div>

<div class="field">
<label>Employee Name</label>
<input type="text" placeholder="Ranveer Singh">
</div>

</div>

<div class="row">

<div class="field">
<label>User Name</label>
<input type="text" placeholder="ranveer">
</div>

<div class="field">
<label>Password</label>
<input type="password" placeholder="********">
</div>

</div>

<div class="row">

<div class="field">
<label>Department</label>

<select>
<option>LPC</option>
<option>ASSY</option>
<option>Maintenance</option>
<option>Admin</option>
</select>

</div>

<div class="field">
<label>Role</label>

<select>
<option>Admin</option>
<option>Supervisor</option>
<option>Maintenance</option>
<option>LPC Operator</option>
<option>ASSY Operator</option>
<option>Store</option>
</select>

</div>

</div>

<div class="row">

<div class="field">
<label>Email ID</label>
<input type="email" placeholder="user@mssl.com">
</div>

<div class="field">
<label>Status</label>

<select>
<option>ACTIVE</option>
<option>INACTIVE</option>
</select>

</div>

</div>

<div class="button-area">

<button type="submit">
💾 Save User
</button>

</div>

</form>

<hr>

<h2 class="section-title">
User List
</h2>

<table>

<tr>
<th>Employee ID</th>
<th>Name</th>
<th>Department</th>
<th>Role</th>
<th>Status</th>
</tr>

<tr>
<td>EMP001</td>
<td>Ranveer Singh</td>
<td>Maintenance</td>
<td>Admin</td>
<td>
<span class="active">
ACTIVE
</span>
</td>
</tr>

<tr>
<td>EMP002</td>
<td>Kritsada</td>
<td>Maintenance</td>
<td>Technician</td>
<td>
<span class="active">
ACTIVE
</span>
</td>
</tr>

<tr>
<td>EMP003</td>
<td>Operator A</td>
<td>LPC</td>
<td>LPC Operator</td>
<td>
<span class="inactive">
INACTIVE
</span>
</td>
</tr>

</table>

</div>

</body>
</html>
