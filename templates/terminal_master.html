<!DOCTYPE html>
<html>
<head>
<title>MSSL Terminal Master</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:0;
}

.header{
    background:#004080;
    color:white;
    text-align:center;
    padding:15px;
}

.container{
    width:95%;
    margin:auto;
    margin-top:20px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px rgba(0,0,0,0.2);
}

.row{
    display:flex;
    gap:20px;
    margin-bottom:15px;
}

.field{
    flex:1;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:5px;
}

input,
select{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    background:#0078d7;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#005ea6;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#004080;
    color:white;
}

.active{
    background:green;
    color:white;
    padding:5px 10px;
    border-radius:5px;
}

.lowstock{
    background:red;
    color:white;
    padding:5px 10px;
    border-radius:5px;
}

.search{
    width:300px;
    margin-bottom:15px;
}

</style>

</head>

<body>

<div class="header">
<h1>MSSL Terminal Master</h1>
</div>

<div class="container">

<h2>Terminal Information</h2>

<form>

<div class="row">

<div class="field">
<label>Terminal Part No</label>
<input type="text"
placeholder="T040123">
</div>

<div class="field">
<label>Terminal Name</label>
<input type="text"
placeholder="Terminal 040 Female">
</div>

</div>

<div class="row">

<div class="field">
<label>Supplier</label>
<input type="text"
placeholder="Yazaki">
</div>

<div class="field">
<label>Associated Machine</label>

<select>
<option>C&C-01</option>
<option>MCR-01</option>
<option>USW-01</option>
<option>KAPPA-01</option>
<option>Cable Cutting-01</option>
</select>

</div>

</div>

<div class="row">

<div class="field">
<label>Store Location</label>
<input type="text"
placeholder="Terminal Store">
</div>

<div class="field">
<label>Rack No</label>
<input type="text"
placeholder="R-02">
</div>

</div>

<div class="row">

<div class="field">
<label>Bin No</label>
<input type="text"
placeholder="B-08">
</div>

<div class="field">
<label>Current Stock</label>
<input type="number"
placeholder="5000">
</div>

</div>

<div class="row">

<div class="field">
<label>Minimum Stock</label>
<input type="number"
placeholder="1000">
</div>

<div class="field">
<label>Status</label>

<select>
<option>ACTIVE</option>
<option>LOW STOCK</option>
<option>OBSOLETE</option>
</select>

</div>

</div>

<button type="submit">
Save Terminal
</button>

</form>

<hr>

<h2>Terminal Inventory</h2>

<input
class="search"
type="text"
placeholder="Search Terminal Part">

<table>

<tr>
<th>Part No</th>
<th>Name</th>
<th>Machine</th>
<th>Location</th>
<th>Rack</th>
<th>Bin</th>
<th>Stock</th>
<th>Status</th>
</tr>

<tr>
<td>T040123</td>
<td>Terminal 040 Female</td>
<td>C&C-01</td>
<td>Terminal Store</td>
<td>R-02</td>
<td>B-08</td>
<td>5000</td>
<td>
<span class="active">
ACTIVE
</span>
</td>
</tr>

<tr>
<td>T070555</td>
<td>Terminal 070 Male</td>
<td>MCR-01</td>
<td>Terminal Store</td>
<td>R-03</td>
<td>B-04</td>
<td>500</td>
<td>
<span class="lowstock">
LOW STOCK
</span>
</td>
</tr>

</table>

<br>

<a href="/admin">
⬅ Back To Dashboard
</a>

</div>

</body>
</html>
