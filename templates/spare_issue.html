<!DOCTYPE html>
<html>
<head>
<title>MSSL Spare Issue</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:#f4f6f9;
}

.header{
background:linear-gradient(90deg,#003366,#0078d7);
color:white;
padding:18px;
text-align:center;
}

.container{
width:95%;
margin:auto;
margin-top:15px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
margin-bottom:15px;
}

.field label{
display:block;
font-weight:bold;
margin-bottom:5px;
color:#003366;
}

input,
select,
textarea{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
font-size:14px;
}

textarea{
height:80px;
resize:none;
}

.section-title{
font-size:20px;
margin-bottom:15px;
color:#003366;
border-left:5px solid #0078d7;
padding-left:10px;
}

.button-area{
text-align:center;
margin-top:20px;
}

button{
background:#dc3545;
color:white;
border:none;
padding:12px 25px;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#b02a37;
}

.info-card{
background:#fff3cd;
padding:10px;
border-left:5px solid #ffc107;
border-radius:5px;
margin-bottom:15px;
}

</style>

</head>

<body>

<div class="header">
<h1>Spare Issue Entry</h1>
</div>

<div class="container">

<div class="info-card">
Issue spare parts against breakdown ticket and update inventory stock.
</div>

<h2 class="section-title">
Spare Issue Details
</h2>

<form>

<div class="row">

<div class="field">
<label>Issue No</label>
<input type="text"
placeholder="ISS-001">
</div>

<div class="field">
<label>Date</label>
<input type="date">
</div>

</div>

<div class="row">

<div class="field">
<label>Ticket No</label>
<input type="text"
placeholder="LPC001">
</div>

<div class="field">
<label>Machine Name</label>
<input type="text"
placeholder="C&C-01">
</div>

</div>

<div class="row">

<div class="field">
<label>Part Number</label>
<input type="text"
placeholder="SP001">
</div>

<div class="field">
<label>Part Name</label>
<input type="text"
placeholder="Applicator Blade">
</div>

</div>

<div class="row">

<div class="field">
<label>Current Stock</label>
<input type="number"
placeholder="100">
</div>

<div class="field">
<label>Issue Quantity</label>
<input type="number"
placeholder="1">
</div>

</div>

<div class="row">

<div class="field">
<label>Issued To</label>
<input type="text"
placeholder="Kritsada">
</div>

<div class="field">
<label>Department</label>

<select>
<option>LPC</option>
<option>ASSY</option>
<option>Maintenance</option>
</select>

</div>

</div>

<div class="row">

<div class="field">
<label>Store Location</label>
<input type="text"
placeholder="Maintenance Store">
</div>

<div class="field">
<label>Rack / Bin Location</label>
<input type="text"
placeholder="R-01 / B-05">
</div>

</div>

<label>Reason for Issue</label>

<textarea
placeholder="Applicator damaged during production">
</textarea>

<br><br>

<label>Remarks</label>

<textarea
placeholder="Additional Remarks">
</textarea>

<div class="button-area">

<button type="submit">
📤 Issue Spare
</button>

</div>

</form>

</div>

</body>
</html>
