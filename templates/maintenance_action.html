<!DOCTYPE html>
<html>
<head>
<title>Maintenance Action</title>

<style>

body{
font-family:Segoe UI;
background:#f4f6f9;
margin:0;
}

.header{
background:#003366;
color:white;
padding:15px;
text-align:center;
}

.container{
width:90%;
margin:auto;
margin-top:20px;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0px 0px 10px rgba(0,0,0,.2);
}

.row{
display:flex;
gap:20px;
margin-bottom:15px;
}

.field{
flex:1;
}

label{
font-weight:bold;
display:block;
margin-bottom:5px;
}

input,
select,
textarea{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
box-sizing:border-box;
}

textarea{
height:100px;
}

button{
background:#0078d7;
color:white;
border:none;
padding:12px 25px;
border-radius:5px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#005ea6;
}

</style>

</head>

<body>

<div class="header">
<h1>Maintenance Action Form</h1>
</div>

<div class="container">

<form>

<div class="row">

<div class="field">
<label>Ticket No</label>
<input type="text" placeholder="LPC001">
</div>

<div class="field">
<label>Date</label>
<input type="date">
</div>

</div>

<div class="row">

<div class="field">
<label>Machine Name</label>
<input type="text" placeholder="C&C-01">
</div>

<div class="field">
<label>Status</label>

<select>
<option>OPEN</option>
<option>PENDING</option>
<option>CLOSED</option>
</select>

</div>

</div>

<div class="row">

<div class="field">
<label>Problem</label>
<input type="text" placeholder="Applicator Damage">
</div>

<div class="field">
<label>Reason</label>
<input type="text" placeholder="Applicator Life Exceeded">
</div>

</div>

<label>Action Taken</label>

<textarea
placeholder="Describe maintenance action taken">
</textarea>

<br><br>

<div class="row">

<div class="field">
<label>Part Used</label>
<input type="text" placeholder="Applicator Blade">
</div>

<div class="field">
<label>Qty Used</label>
<input type="number" placeholder="1">
</div>

</div>

<div class="row">

<div class="field">
<label>Breakdown Start Time</label>
<input type="time">
</div>

<div class="field">
<label>Breakdown End Time</label>
<input type="time">
</div>

</div>

<div class="row">

<div class="field">
<label>Total Downtime (Min)</label>
<input type="number" placeholder="25">
</div>

<div class="field">
<label>Technician Name</label>
<input type="text" placeholder="Kritsada">
</div>

</div>

<label>Remarks</label>

<textarea
placeholder="Additional remarks">
</textarea>

<br><br>

<button type="submit">
Save Maintenance Action
</button>

</form>

</div>

</body>
</html>
