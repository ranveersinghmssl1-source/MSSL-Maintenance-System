<!DOCTYPE html>
<html>
<head>
    <title>RCA Form</title>
</head>
<body>

<h1>Root Cause Analysis</h1>

<form>

<label>Ticket No</label><br>
<input type="text">

<br><br>

<label>Machine Name</label><br>
<input type="text">

<br><br>

<label>Problem</label><br>
<input type="text">

<br><br>

<label>Root Cause</label><br>
<textarea rows="4" cols="50"></textarea>

<br><br>

<label>Corrective Action</label><br>
<textarea rows="4" cols="50"></textarea>

<br><br>

<label>Countermeasure</label><br>
<textarea rows="4" cols="50"></textarea>

<br><br>

<label>Status</label><br>

<select>
<option>OPEN</option>
<option>PENDING</option>
<option>CLOSED</option>
</select>

<br><br>

<button type="submit">
Save RCA
</button>

</form>

</body>
</html>
