<head>
    <title>RCA Form</title>
</head>
<body>

<h1>Root Cause Analysis</h1>

<form>

<label>Ticket No</label><br>
<input type="text">

<br><br>

<label>Machine Name</label><br>
<input type="text">

<br><br>

<input type="text">

<br><br>

<label>Root Cause</label><br>
<textarea rows="4" cols="50"></textarea>

<br><br>
    
<label>Spare Used</label><br>
<input type="text">

<br><br>

<label>Quantity Used</label><br>
<input type="number">

<br><br>

<label>Countermeasure</label><br>
<textarea rows="4" cols="50"></textarea>

<br><br>

<select>
<option>OPEN</option>
<option>PENDING</option>
<option>CLOSED</option>
</select>

<br><br>

<button type="submit">
Save RCA
</button>
<br><br>

<button type="submit">
Close Ticket
</button>
    
</form>

</body>
</html>
